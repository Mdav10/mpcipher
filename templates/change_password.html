<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPC — Change Password</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#matrix{position:fixed;inset:0;z-index:0;opacity:.15}
.box{position:relative;z-index:2;width:min(440px,92vw);background:#0a0a0a;border:2px solid #0f0;border-radius:14px;padding:36px 28px;box-shadow:0 0 50px rgba(0,255,0,.25)}
h1{font-size:18px;text-align:center;letter-spacing:2px;text-shadow:0 0 10px #0f0}
.sub{font-size:11px;text-align:center;opacity:.65;margin:6px 0 24px;border-bottom:1px solid #0f033;padding-bottom:14px}
label{display:block;font-size:11px;margin-bottom:6px;letter-spacing:1px}
input{width:100%;background:#000;color:#0f0;border:1px solid #0f0;padding:12px;border-radius:5px;font-family:inherit;font-size:14px;outline:none}
input:focus{box-shadow:0 0 12px rgba(0,255,0,.3);background:#001a00}
.field{margin-bottom:16px}
button{width:100%;padding:12px;background:#001a00;color:#0f0;border:1px solid #0f0;border-radius:5px;font-family:inherit;font-weight:bold;font-size:14px;cursor:pointer;transition:.2s}
button:hover{background:#0f0;color:#000}
.msg{min-height:18px;font-size:12px;text-align:center;margin-top:12px}
.ok{color:#0f0}.err{color:#f55}
.warn{background:#330;border:1px solid #ff0;color:#ff0;padding:10px;border-radius:6px;font-size:12px;margin-bottom:16px;text-align:center}
.strength{height:6px;background:#111;border-radius:3px;margin-top:6px;overflow:hidden}
.strength-bar{height:100%;width:0%;background:#f00;transition:.3s}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="box">
  <h1>🔐 CHANGE PASSWORD</h1>
  <div class="sub">👤 {{ username }}</div>

  {% if forced %}
  <div class="warn">⚠️ You must change your password before continuing.</div>
  {% endif %}

  <div class="field">
    <label>CURRENT PASSWORD</label>
    <input id="current" type="password" autocomplete="current-password">
  </div>
  <div class="field">
    <label>NEW PASSWORD (min 12 chars)</label>
    <input id="new" type="password" autocomplete="new-password">
    <div class="strength"><div class="strength-bar" id="bar"></div></div>
  </div>
  <div class="field">
    <label>CONFIRM NEW PASSWORD</label>
    <input id="confirm" type="password" autocomplete="new-password">
  </div>
  <button id="submitBtn">▶ UPDATE PASSWORD</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const c=document.getElementById('matrix'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize();addEventListener('resize',resize);
const chars='01アイウエオカキクケコ0123456789#';
const fs=13;let cols=Math.floor(innerWidth/fs),drops=[...Array(cols)].map(()=>Math.random()*innerHeight/fs);
setInterval(()=>{
  x.fillStyle='rgba(0,0,0,0.06)';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#0f0';x.font=fs+'px monospace';
  for(let i=0;i<drops.length;i++){
    x.fillText(chars[Math.random()*chars.length|0],i*fs,drops[i]*fs);
    if(drops[i]*fs>c.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
},40);

const msg=document.getElementById('msg');
const setMsg=(t,cls)=>{msg.textContent=t;msg.className='msg '+(cls||'');};
const bar=document.getElementById('bar');
document.getElementById('new').addEventListener('input',e=>{
  const v=e.target.value;
  let score=0;
  if(v.length>=12)score+=25;
  if(/[A-Z]/.test(v))score+=15;
  if(/[a-z]/.test(v))score+=15;
  if(/[0-9]/.test(v))score+=15;
  if(/[^A-Za-z0-9]/.test(v))score+=15;
  if(v.length>=20)score+=15;
  score=Math.min(100,score);
  bar.style.width=score+'%';
  bar.style.background=score<40?'#f00':score<70?'#ff0':'#0f0';
});

document.getElementById('submitBtn').onclick=async()=>{
  const current=document.getElementById('current').value;
  const nw=document.getElementById('new').value;
  const cf=document.getElementById('confirm').value;
  if(!current||!nw||!cf)return setMsg('Fill all fields','err');
  if(nw.length<12)return setMsg('Password must be 12+ chars','err');
  if(nw!==cf)return setMsg('Passwords do not match','err');
  setMsg('Updating…');
  try{
    const r=await fetch('/api/change-password',{
      method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({current,new:nw})
    });
    const d=await r.json();
    if(r.ok){
      setMsg('✅ Password updated. Redirecting…','ok');
      setTimeout(()=>location.href='/',900);
    } else setMsg(d.error||'Failed','err');
  }catch(e){setMsg('Network error','err');}
};
</script>
</body>
</html>
